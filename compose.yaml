# 云端运行定义。部署与升级见 README「部署」。
name: forum-keeper

services:
  forum-keeper:
    # 钉版本，升级改这一行。
    image: ghcr.io/sunyin0818/forum-keeper:0.7.4
    container_name: forum-keeper
    restart: unless-stopped
    environment:
      # 配置文件只读挂载在 /config；运行状态只写 /data。
      CONFIG_FILE: /config/config.yaml
      STATE_PATH: /data/state.db
    volumes:
      # 状态库，丢了会重推历史提醒。
      - data:/data
      # 配置文件：config.yaml（含 webhook/cookie）。
      - ./config.yaml:/config/config.yaml:ro
    # 应用只写 /data，所以根文件系统只读、/tmp 用 tmpfs。
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # 断网时每分钟一条 error，限制日志体积。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
