# 云端运行定义。部署与升级见 README「部署到云端」。
name: forum-keeper

services:
  forum-keeper:
    # 钉版本，升级改这一行。
    image: ghcr.io/sunyin0818/forum-keeper:0.4.0
    container_name: forum-keeper
    restart: unless-stopped
    # raw：cookie 值里含 `$`，默认会被 compose 当变量插值静默吞掉。
    # 用 raw 后可以整行粘贴浏览器 cookie，不必手工转义 `$$`。
    env_file:
      - path: .env
        format: raw
    environment:
      STATE_PATH: /data/state.db
      # 影响签到调度与卡片/日志时间戳；docker 默认 UTC。
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 状态库，丢了会重推历史提醒。
      - data:/data
    # 应用只写 /data，所以根文件系统只读、/tmp 用 tmpfs。
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # 断网时每分钟一条 error，限制日志体积。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
