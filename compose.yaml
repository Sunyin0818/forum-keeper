services:
  notifier:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    # Local builds win by default. To run a published image instead, set
    #   V2EX_NOTIFIER_IMAGE=ghcr.io/sunyin0818/v2ex-notifier:latest
    # and use `compose pull` + `compose up --no-build`.
    image: ${V2EX_NOTIFIER_IMAGE:-v2ex-notifier:latest}
    container_name: v2ex-notifier
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container-internal path; always on the mounted volume.
      STATE_PATH: /data/state.db
      # V2EX_PROXY is deliberately NOT defaulted here. Its correct value is
      # environment-specific: a laptop needs the Clash proxy on the host, while
      # a cloud VM reaches v2ex.com directly. A wrong default fails silently, so
      # keep it in .env (or pass -e V2EX_PROXY=... explicitly).
    volumes:
      - notifier-data:/data
    extra_hosts:
      # Lets the container reach a proxy running on the host.
      # Podman users can use host.containers.internal instead.
      - "host.docker.internal:host-gateway"

volumes:
  notifier-data:
