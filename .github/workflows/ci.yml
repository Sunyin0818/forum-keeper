name: ci

# Without this, GitHub titles every run with the commit message. Pushing one
# commit to main and then tagging it produces two runs with identical titles,
# which reads as a duplicate trigger. Show the ref instead.
run-name: "ci · ${{ github.event_name }} · ${{ github.ref_name }}"

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: unit tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # Offline end-to-end: mock V2EX API + mock Feishu webhook. No token needed.
      - name: smoke test
        run: ./scripts/smoke.sh

      - name: build
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_SHA::7}" \
            -o bin/forum-keeper ./cmd/forum-keeper

  image:
    needs: test
    # Images are cut from version tags only. Building on every main push would
    # rebuild the same source a second time whenever a tag points at a commit
    # that is already on main, and the two runs would race for shared tags.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Docker Hub is optional: it only kicks in when both secrets are set.
      # Settings -> Secrets and variables -> Actions:
      #   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (an access token, not the password)
      - name: Detect Docker Hub credentials
        id: dockerhub
        env:
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USER" ] && [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets not set; publishing to GHCR only."
          fi

      - name: Compute image list
        id: images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          # ${VAR,,} lowercases: GHCR rejects uppercase repository names.
          list="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            list="${list}"$'\n'"${DOCKERHUB_USERNAME}/forum-keeper"
          fi
          {
            echo "list<<__EOF__"
            echo "$list"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          flavor: |
            # With type=semver this adds `latest` for releases but *not* for
            # pre-releases such as v0.2.0-rc1, which is what we want.
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # semver says 0.y.z is explicitly unstable, so a floating `0`
            # alias would be misleading. Re-enable once we ship 1.0.
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            # This job only runs on a v* tag, so the tag name is the version.
            VERSION=${{ github.ref_name }}
            GOPROXY=https://proxy.golang.org,direct
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Summary
        run: |
          {
            echo "### Published images"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Platforms: \`linux/amd64, linux/arm64\`"
            echo "Version baked in: \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    # A tag is just a pointer; the Release is the human-facing record with notes
    # and the image reference. Create it only after the image is actually up, so
    # the release never points at something that failed to build.
    needs: [test, image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Notes are generated from merged PRs / commits since the last tag.
          generate_release_notes: true
          # Tags like v0.2.0-rc1 get marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            容器镜像：`ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            （linux/amd64 + linux/arm64，含 provenance 与 SBOM）
